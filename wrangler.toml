name = "practice-hub"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# App (public/) und API (/api/*) aus einem Worker
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
ALLOWED_ORIGINS = "https://practice-hub.othniel-erdei.workers.dev"
# Der Lehrer Code steht nirgends im Repo, auch nicht als Hash: Cloudflare Secret TEACHER_CODE (Dashboard, Variablen und Secrets).
# Lehrer Anmeldungen, die vor diesem Zeitpunkt entstanden sind, gelten nicht mehr (nach einem Code Wechsel hochsetzen).
TEACHER_SESSIONS_AFTER = "2026-11-16T20:33:35.000Z"

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "practice-hub"
database_id = "926b6768-4c93-4b4f-8122-83e7577114f9"

# Kostenlose KI von Cloudflare für die Notenbild Transkription
[ai]
binding = "AI"
