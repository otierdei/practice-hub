<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf3e4">
<meta name="robots" content="noindex">
<title>Notenwerte Spiel · Practice Hub</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Young Serif";src:url("fonts/young-serif.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url("fonts/figtree.woff2") format("woff2");font-weight:300 900;font-display:swap}
:root{
  --bg:#ece6de; --surface:#f8f4ee; --sunk:#f0e9e0; --ink:#261f1a; --muted:#64594f; --line:#dccfc1;
  --accent:#b0502b; --accent-ink:#fcf6ef; --ring2:#7a5a3a; --track:#e4d9cb; --danger:#8f2a1f; --good:#3d6b2f;
  --display:"Young Serif", Georgia, serif; --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1b1714; --surface:#26201b; --sunk:#201b17; --ink:#f0e9e1; --muted:#ab9f92; --line:#3e352d;
  --accent:#e0855c; --accent-ink:#1f1510; --ring2:#cfa577; --track:#3a3029; --danger:#f0937a; --good:#a9c98a; color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.8rem,7vw,2.4rem)} h2{font-size:1.35rem}
p{margin:0;text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:.88rem}
.btn{min-height:52px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top a{color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.level{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.level .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:800;flex:none}
.level.done .n{background:var(--accent);color:var(--accent-ink)}
.level:disabled{opacity:.5}
.level b{display:block}
.kit{width:100%;height:auto;display:block;background:var(--sunk);border-radius:18px}
.kit .p{fill:var(--surface);stroke:var(--ink);stroke-width:1.6;transition:fill .15s}
.kit .stand{stroke:var(--muted);stroke-width:2;fill:none}
.kit g[data-k].on .p{fill:var(--accent)}
.kit g[data-k].on{filter:drop-shadow(0 0 6px var(--accent))}
.kit g[data-k].bad .p{fill:var(--danger)}
.kit.tap g[data-k]{cursor:pointer}
.kit.tap g[data-k]:focus-visible .p{stroke:var(--ring2);stroke-width:3}
.kit .hh-top{transition:transform .2s}
.kit.open .hh-top{transform:translateY(-9px)}
.kit .lbl{font:600 12px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--sunk);stroke-width:4px}
.staff{color:var(--ink);background:var(--sunk);border-radius:14px;padding:6px 8px}
.staff svg{display:block;width:100%;height:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;min-height:56px;font-weight:600}
.opt .staff{padding:2px 4px}
.opt.right{border-color:var(--good);box-shadow:0 0 0 2px var(--good)}
.opt.wrong{border-color:var(--danger);opacity:.7}
.fb{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.fb.bad{background:color-mix(in srgb,var(--danger) 14%,var(--surface))}
.big{font-family:var(--display);font-size:1.7rem;line-height:1.1}
.tip{background:var(--sunk);border-radius:14px;padding:10px 12px}
.seq{display:flex;gap:8px;justify-content:center}
.seq span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:800}
.seq span.ok{background:var(--accent);color:var(--accent-ink)}
.seq span.now{outline:3px solid var(--ring2)}
.cert{text-align:center;border:3px double var(--accent);align-items:center}
.stars{font-size:1.6rem;letter-spacing:4px}
input[type=text]{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.staff svg .hl{color:var(--ring2)}

/* Kinder Design wie die Kinderansicht der App: Creme, kräftige Farben, dicke Ränder, immer hell */
html:root{--bg:#fbf3e4;--surface:#ffffff;--sunk:#f6ead3;--ink:#23241f;--muted:#4a4b44;--line:#23241f;--accent:#2e86ab;--accent-ink:#ffffff;--ring2:#e4572e;--track:#ead9b8;--danger:#d64b26;--good:#2f8a5b;color-scheme:light}
.card,.level,.opt,.staff,.kit,input[type=text]{border:3px solid #23241f}
.btn{border:3px solid #23241f;font-weight:800}
.btn.primary{background:#2e86ab;color:#fff;border:3px solid #23241f;box-shadow:0 5px 0 #23241f}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #23241f}
.level{box-shadow:0 4px 0 #23241f}
.level .n{border:3px solid #23241f;background:#f2c14e;color:#23241f}
.level.done .n{background:#8bc9a3;color:#23241f}
.bar{height:14px;border:2px solid #23241f}.bar i{background:#8bc9a3}
.seq span{border:2px solid #23241f;background:#fff}.seq span.ok{background:#8bc9a3;color:#23241f}
.kit .p{stroke:#23241f;stroke-width:2.2}
.kit g[data-k].on .p{fill:#f2c14e}.kit g[data-k].on{filter:drop-shadow(0 0 8px #f2c14e)}
.kit g[data-k].bad .p{fill:#e4572e}
.staff{background:#fff}
.tip{background:#9cc5e0;border:3px solid #23241f}
.opt.right{background:#8bc9a3;border-color:#23241f;box-shadow:0 0 0 3px #2f8a5b}
.opt.wrong{background:#f6c3b3;opacity:1}
.fb.good{background:#8bc9a3;border:3px solid #23241f}.fb.bad{background:#f6c3b3;border:3px solid #23241f}
.cert{border:4px solid #23241f;background:#f2c14e}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script src="notation.js?v=93"></script>
<script src="game-audio.js?v=2"></script>
<script>
'use strict';
// Notenwerte Spiel: Ganze, Halbe, Viertel, Achtel, Sechzehntel, Triolen, Pausen und Flams lernen, zählen und hören.
// Fertig ist man erst, wenn jeder Wert mehrmals hintereinander richtig war und die Prüfung bestanden ist.
const VALS = [
  { k: 'q', name: 'Viertel Note', len: 4, beats: '1 Schlag', count: '1 2 3 4', tip: 'Ausgefüllter Kopf mit Hals. Vier Viertel füllen einen 4/4 Takt.' },
  { k: 'h', name: 'Halbe Note', len: 8, beats: '2 Schläge', count: '1 (2) 3 (4)', tip: 'Leerer Kopf mit Hals. Sie klingt so lang wie zwei Viertel.' },
  { k: 'w', name: 'Ganze Note', len: 16, beats: '4 Schläge', count: '1 (2 3 4)', tip: 'Leerer Kopf ohne Hals. Sie füllt den ganzen Takt.' },
  { k: 'e', name: 'Achtel Note', len: 2, beats: '½ Schlag', count: '1 + 2 + 3 + 4 +', tip: 'Ein Fähnchen. Zwei Achtel passen in einen Schlag, man verbindet sie mit einem Balken.' },
  { k: 's', name: 'Sechzehntel Note', len: 1, beats: '¼ Schlag', count: '1 e + a 2 e + a', tip: 'Zwei Fähnchen oder zwei Balken. Vier Sechzehntel passen in einen Schlag.' },
  { k: 't', name: 'Achtel Triole', len: 4, beats: '3 Noten auf 1 Schlag', count: '1 ta te 2 ta te', tip: 'Drei Achtel mit einer 3 darüber. Sie teilen einen Schlag in drei gleiche Teile.' },
  { k: 'rq', name: 'Viertel Pause', len: 4, beats: '1 Schlag Pause', count: '1 (2) 3 4', tip: 'Ein Zickzack Zeichen. Hier spielst du einen Schlag lang nichts, zählst aber weiter.' },
  { k: 'rh', name: 'Halbe Pause', len: 8, beats: '2 Schläge Pause', count: '1 2 (3 4)', tip: 'Ein kleiner Balken, der auf der Mittellinie sitzt, wie ein Hut.' },
  { k: 'rw', name: 'Ganze Pause', len: 16, beats: '4 Schläge Pause', count: '(1 2 3 4)', tip: 'Ein kleiner Balken, der unter der 4. Linie hängt. Ein ganzer Takt Pause.' },
  { k: 're', name: 'Achtel Pause', len: 2, beats: '½ Schlag Pause', count: '(1) + 2 +', tip: 'Sieht aus wie eine kleine 7. Ein halber Schlag Pause.' },
  { k: 'f', name: 'Flam', len: 4, beats: 'kleine Vorschlagsnote + Hauptschlag', count: '1 2 3 4 (auf dem Schlag)', tip: 'Eine kleine Note mit Schrägstrich direkt vor der Hauptnote. Beide Hände schlagen fast gleichzeitig, die kleine Note leise und ganz kurz davor.' },
];
const BY = Object.fromEntries(VALS.map((v) => [v.k, v]));
const GROUPS = [['q', 'h', 'w'], ['e', 's', 't'], ['rq', 'rh', 'rw', 're'], ['f']];
const LEN_LABELS = ['4 Schläge', '2 Schläge', '1 Schlag', '½ Schlag', '¼ Schlag', '3 Noten auf 1 Schlag', '4 Schläge Pause', '2 Schläge Pause', '1 Schlag Pause', '½ Schlag Pause', 'kleine Vorschlagsnote + Hauptschlag'];
const LEVELS = [
  { id: 1, title: 'Entdecken', text: 'Lerne jeden Notenwert kennen: Zeichen, Länge, Zählen und Klang.' },
  { id: 2, title: 'Wie lang ist das?', text: 'Du siehst ein Zeichen und wählst die Länge.', type: 'len', need: 2 },
  { id: 3, title: 'Finde das Zeichen', text: 'Du liest den Namen und wählst das richtige Zeichen.', type: 'sym', need: 2 },
  { id: 4, title: 'Takt rechnen', text: 'Was fehlt im Takt? Wie viele passen hinein?', type: 'math', rounds: 8 },
  { id: 5, title: 'Zählen', text: 'Wähle, wie man den Takt zählt.', type: 'count', rounds: 6 },
  { id: 6, title: 'Hör genau', text: 'Hör dir einen Takt an und finde die passenden Noten.', type: 'hear', rounds: 6 },
  { id: 7, title: 'Flams', text: 'Flams hören, lesen und mit den richtigen Händen spielen.', type: 'flam' },
  { id: 8, title: 'Abschlussprüfung', text: '12 Fragen gemischt. Mit 11 richtigen bist du Rhythmusprofi.', type: 'exam' },
];
const KEY = 'ph_notenwerte';
let P = load(), G = null;
function load() { try { return Object.assign({ name: '', done: {}, cert: null }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return { name: '', done: {}, cert: null }; } }
function appLogin() { try { const t = JSON.parse(localStorage.getItem('ph_token') || 'null'), r = JSON.parse(localStorage.getItem('ph_role') || 'null'); return t && r === 'student' ? t : null; } catch (e) { return null; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
  const t = appLogin(); if (!t) return;
  fetch('/api/my/game', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t }, body: JSON.stringify({ game: 'werte', done: Object.keys(P.done).map(Number), total: LEVELS.length, cert: P.cert }) }).catch(() => {});
}
if (!P.name) { try { const n = JSON.parse(localStorage.getItem('ph_name') || 'null'); if (n) P.name = String(n).split(' ')[0]; } catch (e) {} }
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];

// ---------- Noten zeichnen (Snare im 3. Zwischenraum, wie in der App) ----------
// Ein Takt ist eine Liste von Ereignissen: { k: Wertschlüssel } in der Reihenfolge, Länge aus VALS. 'gap' = Lücke zum Ausfüllen.
const Y = 42, TOP = 14, LINES = [30, 38, 46, 54, 62];
function head(x, open, small) { const sc = small ? 0.62 : 1; return open ? `<ellipse cx="${x}" cy="${Y}" rx="${5.4 * sc}" ry="${3.9 * sc}" transform="rotate(-20 ${x} ${Y})" fill="none" stroke="currentColor" stroke-width="1.8"/>` : `<ellipse cx="${x}" cy="${Y}" rx="${5.4 * sc}" ry="${3.9 * sc}" transform="rotate(-20 ${x} ${Y})" fill="currentColor"/>`; }
const stem = (x, top = TOP) => `<line x1="${x + 5}" x2="${x + 5}" y1="${Y}" y2="${top}" stroke="currentColor" stroke-width="1.4"/>`;
const flag = (x, i) => `<path d="M${x + 5} ${TOP + i * 7} q 8 6 7 15" fill="none" stroke="currentColor" stroke-width="2"/>`;
function rest(k, x) {
  if (k === 'rw') return `<rect x="${x - 6}" y="38" width="12" height="4.5" fill="currentColor"/>`;
  if (k === 'rh') return `<rect x="${x - 6}" y="41.5" width="12" height="4.5" fill="currentColor"/>`;
  if (k === 'rq') return `<path d="M${x - 2} 31 l5 6 l-5 6 l5 6 q-7 -2 -4 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  return `<circle cx="${x - 2}" cy="40" r="2.4" fill="currentColor"/><path d="M${x - 2} 41 q4 2 7 -2 l-5 14" fill="none" stroke="currentColor" stroke-width="1.8"/>`;
}
function grace(x) { const gx = x - 13; return `<g>${head(gx, false, true)}<line x1="${gx + 3.2}" x2="${gx + 3.2}" y1="${Y}" y2="${Y - 20}" stroke="currentColor" stroke-width="1"/><path d="M${gx + 3.2} ${Y - 20} q5 3 4 9" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="${gx - 1}" y1="${Y - 8}" x2="${gx + 8}" y2="${Y - 16}" stroke="currentColor" stroke-width="1.1"/></g>`; }
function barSVG(evs, opt = {}) {
  const W = opt.w || 340, x0 = 52, span = W - x0 - 14, out = [];
  LINES.forEach((y) => out.push(`<line x1="8" x2="${W - 4}" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="1" opacity=".55"/>`));
  out.push(`<rect x="12" y="38" width="3" height="16" fill="currentColor"/><rect x="18" y="38" width="3" height="16" fill="currentColor"/>`);
  out.push(`<text x="34" y="45" font-size="17" font-weight="800" text-anchor="middle" fill="currentColor" font-family="Georgia,serif">4</text><text x="34" y="61" font-size="17" font-weight="800" text-anchor="middle" fill="currentColor" font-family="Georgia,serif">4</text>`);
  out.push(`<line x1="${W - 4}" x2="${W - 4}" y1="30" y2="62" stroke="currentColor" stroke-width="2.5"/>`);
  // Zeitpositionen
  let t = 0; const items = evs.map((e) => { const len = e.k === 'gap' ? e.len : BY[e.k].len; const it = { ...e, t, len }; t += len; return it; });
  const X = (tt) => x0 + (tt / 16) * span + 6;
  // Balkengruppen: Achtel und Sechzehntel innerhalb eines Schlags
  const beam = [];
  items.forEach((it) => { if (it.k === 'e' || it.k === 's') { const b = Math.floor(it.t / 4); const last = beam[beam.length - 1]; if (last && last.b === b && last.end === it.t) { last.n.push(it); last.end = it.t + it.len; } else beam.push({ b, n: [it], end: it.t + it.len }); } });
  const beamed = new Set(); beam.filter((g) => g.n.length > 1).forEach((g) => {
    g.n.forEach((it) => beamed.add(it));
    const xa = X(g.n[0].t) + 5, xb = X(g.n[g.n.length - 1].t) + 5;
    out.push(`<rect x="${xa - 0.7}" y="${TOP}" width="${xb - xa + 1.4}" height="4.5" fill="currentColor"/>`);
    g.n.forEach((it, i) => { if (it.k !== 's') return; const nx = g.n[i + 1], pv = g.n[i - 1]; const xi = X(it.t) + 5;
      if (nx && nx.k === 's') out.push(`<rect x="${xi - 0.7}" y="${TOP + 7}" width="${X(nx.t) + 5 - xi + 1.4}" height="4.5" fill="currentColor"/>`);
      else if (!(pv && pv.k === 's')) out.push(`<rect x="${nx ? xi : xi - 8}" y="${TOP + 7}" width="8" height="4.5" fill="currentColor"/>`); });
  });
  items.forEach((it, idx) => {
    const x = X(it.t), hi = opt.hl === idx ? ' class="hl"' : '';
    if (it.k === 'gap') { out.push(`<rect x="${x - 8}" y="20" width="${Math.max(24, (it.len / 16) * span - 6)}" height="44" rx="6" fill="none" stroke="var(--ring2)" stroke-width="2" stroke-dasharray="5 4"/><text x="${x + Math.max(24, (it.len / 16) * span - 6) / 2 - 8}" y="47" text-anchor="middle" font-size="18" font-weight="800" fill="var(--ring2)">?</text>`); return; }
    if (it.k[0] === 'r') { out.push(`<g${hi}>${rest(it.k, x)}</g>`); return; }
    if (it.k === 't') { const xs = [0, 1, 2].map((i) => x + i * ((span / 4) / 3)); out.push(`<g${hi}>${xs.map((xx) => head(xx) + stem(xx)).join('')}<rect x="${xs[0] + 4.3}" y="${TOP}" width="${xs[2] - xs[0] + 1.4}" height="4.5" fill="currentColor"/><text x="${xs[1] + 5}" y="${TOP - 3}" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" font-style="italic">3</text></g>`); return; }
    const open = it.k === 'w' || it.k === 'h';
    let g = head(x, open);
    if (it.k !== 'w') g += stem(x);
    if (!beamed.has(it)) { if (it.k === 'e') g += flag(x, 0); if (it.k === 's') g += flag(x, 0) + flag(x, 1); }
    if (it.k === 'f') g = grace(x) + g;
    out.push(`<g${hi}>${g}</g>`);
  });
  return `<svg viewBox="0 0 ${W} 74" role="img" aria-label="${esc(opt.label || 'Takt')}">${out.join('')}</svg>`;
}
// Einzelnes Zeichen groß zeigen
function symSVG(k) {
  const W = 120, out = [];
  LINES.forEach((y) => out.push(`<line x1="6" x2="${W - 6}" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="1" opacity=".45"/>`));
  const x = 56;
  if (k[0] === 'r') out.push(rest(k, x));
  else if (k === 't') { const xs = [x - 22, x, x + 22]; out.push(xs.map((xx) => head(xx) + stem(xx)).join('') + `<rect x="${xs[0] + 4.3}" y="${TOP}" width="${xs[2] - xs[0] + 1.4}" height="4.5" fill="currentColor"/><text x="${xs[1] + 5}" y="${TOP - 3}" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" font-style="italic">3</text>`); }
  else { let g = head(x, k === 'w' || k === 'h'); if (k !== 'w') g += stem(x); if (k === 'e') g += flag(x, 0); if (k === 's') g += flag(x, 0) + flag(x, 1); if (k === 'f') g = grace(x) + g; out.push(g); }
  return `<svg viewBox="0 0 ${W} 74" role="img" aria-label="Notenzeichen">${out.join('')}</svg>`;
}
const staff = (svg) => `<div class="staff">${svg}</div>`;

// ---------- Takte erzeugen, zählen, abspielen ----------
const BEATS = { basic: [['q'], ['e', 'e'], ['rq']], mid: [['q'], ['e', 'e'], ['s', 's', 's', 's'], ['e', 's', 's'], ['s', 's', 'e'], ['rq'], ['re', 'e'], ['t']], flam: [['q'], ['f'], ['e', 'e'], ['rq']] };
function makeBar(level = 'mid') {
  const out = []; let b = 0;
  while (b < 4) {
    if ((b === 0 || b === 2) && Math.random() < 0.18) { out.push({ k: pick(['h', 'h', 'rh']) }); b += 2; continue; }
    pick(BEATS[level]).forEach((k) => out.push({ k })); b++;
  }
  return out;
}
const SYL = ['', 'e', '+', 'a'];
function countText(evs) {
  // Angeschlagene Silben normal, gehaltene oder pausierte in Klammern
  let t = 0; const parts = [];
  for (const e of evs) {
    const v = BY[e.k], beat = Math.floor(t / 4) + 1, sub = t % 4;
    if (e.k === 't') parts.push(`${beat} ta te`);
    else { const syl = sub === 0 ? String(beat) : SYL[sub]; parts.push(e.k[0] === 'r' ? `(${syl})` : syl);
      for (let x = t + 4 - sub; x < t + v.len; x += 4) parts.push(`(${Math.floor(x / 4) + 1})`); }
    t += v.len;
  }
  return parts.join(' ').replace(/\) \(/g, ' ');
}
const sameBar = (a, b) => a.map((e) => e.k).join() === b.map((e) => e.k).join();
let audioCtx = null;
function playBar(evs, bpm = 72, countIn = true) {

    : lv.type === 'math' ? quizRun(lv, qMath, { rounds: lv.rounds })
    : lv.type === 'count' ? quizRun(lv, qCount, { rounds: lv.rounds })
    : lv.type === 'hear' ? quizRun(lv, qHear, { rounds: lv.rounds })
    : lv.type === 'flam' ? quizRun(lv, (k) => FLAMQ[k](), { keys: [0, 1, 2, 3], need: 1 })
    : examRun(lv);
  window.scrollTo(0, 0); render();
}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; try { DrumNotation.loadSamples(); } catch (e) {}
  if (act === 'home') { G = null; return render(); }
  if (act === 'level') { const nm = $('#nm'); if (nm) { P.name = nm.value.trim(); save(); } return startLevel(Number(el.dataset.id)); }
  if (act === 'cert') return showCert();
  if (act === 'hearVal') return playBar(exampleBar(el.dataset.k), 72, false);
  if (act === 'hearFlam') return playBar(Array(4).fill(0).map(() => ({ k: 'f' })), 66, false);
  if (act === 'hearPlain') { const ctx = DrumNotation.audio(); for (let i = 0; i < 4; i++) { const t = ctx.currentTime + 0.15 + i * 0.9; DrumNotation.hit('sn', t); DrumNotation.hit('sn', t); } return; }
  if (act === 'reset') { if (confirm('Wirklich von vorne anfangen? Dein Fortschritt wird gelöscht.')) { P = { name: P.name, done: {}, cert: null }; save(); render(); } return; }
  if (G && G.act) G.act(act, el);
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'nm') { P.name = ev.target.value.trim(); save(); } });
render();
</script>
