<script>
'use strict';
// ---------- Grundlagen ----------
const qs = new URLSearchParams(location.search);
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const API = (LOCAL && qs.get('api')) || ''; // App und API laufen auf derselben Adresse
const CONSENT_TEXT = 'Ich bin einverstanden, dass Oti (Schlagzeugunterricht) in Practice Hub den Vornamen, das Geburtsjahr, Unterrichtsnotizen, Hausaufgaben und Übezeiten meines Kindes speichert, um den Unterricht zu begleiten. Die Daten liegen bei Cloudflare in der EU, werden nicht weitergegeben und spätestens 12 Monate nach Ende des Unterrichts gelöscht. Ich kann die Einwilligung jederzeit bei Oti widerrufen.';
// In der Schüler Simulation landet alles in einer eigenen Sandbox (ph_pv_…), die beim Beenden gelöscht wird
const pk = (k) => 'ph_' + (window.__pv && !['token', 'role', 'name'].includes(k) ? 'pv_' : '') + k;
const store = {
  get(k, d) { try { const v = localStorage.getItem(pk(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(pk(k), JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(pk(k)); } catch (e) {} },
};
const S = { token: store.get('token', null), role: store.get('role', null), name: store.get('name', null), tab: null, data: null, overlay: null, exercises: null };
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const WD = ['', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const pad = (n) => String(n).padStart(2, '0');
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDate = (s) => { if (!s) return ''; const d = new Date(s.length === 10 ? s + 'T12:00:00' : s); return d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' }); };
const mins = (sec) => Math.round(sec / 60);
const clock = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600); const m = Math.floor((t % 3600) / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(t % 60); };

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

async function api(path, body) {
  if (window.__pv) return previewApi(path, body || {});
  const headers = { 'Content-Type': 'application/json' };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  let res;
  try { res = await fetch(API + path, { method: 'POST', headers, body: JSON.stringify(body || {}) }); }
  catch (e) { const err = new Error('Keine Verbindung. Bitte Internet prüfen.'); err.offline = true; throw err; }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/login') { logoutLocal(); throw new Error(data.error || 'Bitte neu anmelden.'); }

}

// Kreis: value 0..1
function ring(value, size, stroke, color, label, inner, sub) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, value || 0));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    ${v > 0.004 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(v * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>` : ''}
    ${inner ? `<text x="50%" y="${sub ? '47%' : '50%'}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-size="${Math.round(size / 4.6)}" font-weight="700">${esc(inner)}</text>` : ''}
    ${sub ? `<text x="50%" y="66%" text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="${Math.max(11, Math.round(size / 12))}">${esc(sub)}</text>` : ''}
  </svg>`;
}

async function boot() {
  const m = /[#&]c=([A-Za-z0-9-]+)/.exec(location.hash);
  if (m) {
    history.replaceState(null, '', location.pathname + location.search);
    try { await doLogin(m[1]); return; } catch (e) { S.loginError = e.message; }
  }
  if (S.token) { S.tab = TABS[S.role] ? TABS[S.role][0][0] : null; render(); await load(); flushOutbox(); }
  else render();
}
async function doLogin(code) {
  const r = await api('/api/login', { code });
  if (S.token && S.token !== r.token) { try { await api('/api/logout'); } catch (e) {} }
  S.token = r.token; S.role = r.role; S.name = r.name; S.tab = TABS[r.role][0][0];
  store.set('token', r.token); store.set('role', r.role); store.set('name', r.name);
  render(); await load(); flushOutbox();
}

// Schüler Simulation: Lesen echt, Schreiben nur in der Sandbox
async function previewApi(path, b) {
  const d = S.preview.data, now = new Date().toISOString();
  switch (path) {
    case '/api/home': return d;
    case '/api/session/add': d.sessions = [Object.assign({ id: 'pv' + Date.now(), created_at: now }, b)].concat(d.sessions || []); return { ok: true };
    case '/api/assignment/toggle': return { ok: true };
    case '/api/goal/toggle': { const g = d.goals.find((x) => x.id === b.id); g.status = g.status === 'erreicht' ? 'offen' : 'erreicht'; return { status: g.status }; }
    case '/api/goal/add': d.goals.push({ id: 'pv' + Date.now(), title: String(b.title || ''), status: 'offen', created_at: now }); return { ok: true };
    case '/api/my/song': return { ok: true };
    case '/api/songs': case '/api/song': case '/api/course': case '/api/ping': {
      window.__pv = false; try { return await api(path, b); } finally { window.__pv = true; }
    }
    default: throw new Error('Simulation: das wird nicht gespeichert');
  }
}

function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function toMin(t) { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function todayStudents() {
  const wd = ((new Date().getDay() + 6) % 7) + 1;
  return S.data.students.filter((s) => s.weekday === wd && s.status === 'aktiv').sort((a, b) => (toMin(a.lesson_time) || 0) - (toMin(b.lesson_time) || 0));
}
const CANCEL = { schueler: 'Schüler hat abgesagt', kurzfristig: 'Kurzfristig abgesagt', lehrer: 'Lehrer hat abgesagt' };
function cancelledToday(id) { const c = (S.data.cancellations || []).find((x) => x.student_id === id && x.date === localDate()); return c ? c.kind : null; }
function cancelButtons(id) {
  const c = cancelledToday(id);
  return c ? `<div class="row between"><span class="pill">${CANCEL[c]}</span><button class="btn small" data-act="cancelUndo" data-id="${id}">Zurücknehmen</button></div>`
    : `<div class="row" style="gap:6px"><span class="small muted">Abgesagt:</span>${[['schueler', 'Schüler'], ['kurzfristig', 'Kurzfristig'], ['lehrer', 'Ich']].map(([k, l]) => `<button class="chip" data-act="cancel" data-id="${id}" data-k="${k}">${l}</button>`).join('')}</div>`;
}
function currentStudent() {
  const list = todayStudents().filter((s) => !cancelledToday(s.id)), n = nowMinutes();
  return list.find((s) => { const t = toMin(s.lesson_time); return t != null && n >= t - 10 && n < t + (s.lesson_minutes || 45); })
    || list.find((s) => (toMin(s.lesson_time) || 0) > n) || null;
}
// Bibliothek: Hauptkategorien, Suche, Kurs nach Lektionen
const LIB_ORDER = ['Aufwärmen', 'Grooves', 'Eigene Beats', 'Fills', 'Beat + Fill', 'Rudiments', 'Technik', 'Build', 'Lesen', 'Worship Songs', 'Gitarre', 'Kurs'];
const libMain = (e) => (/^Kurs L\d+/.test(e.category || '') ? 'Kurs' : e.category || 'Ohne Kategorie');
function libMatch(e, q) { if (!q) return true; const h = [e.title, e.category, e.notes, e.book_ref].join(' ').toLowerCase(); return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => h.includes(w)); }
function libMains(ex) { const set = [...new Set(ex.map(libMain))]; return set.sort((a, b) => ((LIB_ORDER.indexOf(a) + 1) || 99) - ((LIB_ORDER.indexOf(b) + 1) || 99) || a.localeCompare(b, 'de')); }
function libCatsHTML(ex) {
  const hits = ex.filter((e) => libMatch(e, S.libQ)); const cur = S.libCat || '';
  return [`<button type="button" class="chip" data-act="libCat" data-v="" aria-pressed="${!cur}">Alle ${hits.length}</button>`].concat(libMains(ex).map((m) => { const n = hits.filter((e) => libMain(e) === m).length; return `<button type="button" class="chip" data-act="libCat" data-v="${esc(m)}" aria-pressed="${cur === m}" ${n ? '' : 'disabled'}>${esc(m)} ${n}</button>`; })).join('');

function libItem(e) { return `<div class="item" style="flex-direction:column;align-items:stretch"><button class="link t" data-act="editExercise" data-id="${e.id}"><b>${esc(e.title)}</b><br><span class="muted small">${esc(sourceLabel(e))}${e.target_bpm ? ' · Ziel ' + e.target_bpm + ' BPM' : ''}</span></button>${notationPreview(e.notation, e.title)}</div>`; }
function libListHTML(ex) {
  const q = S.libQ || '', hits = ex.filter((e) => libMatch(e, q) && (!S.libCat || libMain(e) === S.libCat));
  if (!hits.length) return `<div class="empty">Nichts gefunden${q ? ' für „' + esc(q) + '“' : ''}.</div>`;
  const open = !!(q || S.libCat);
  return libMains(hits).map((m) => {
    const list = hits.filter((e) => libMain(e) === m).sort((a, b) => a.title.localeCompare(b.title, 'de', { numeric: true }));
    let body;
    if (m === 'Kurs') {
      // Kurs nach Level (Starter bis Worship Ready), darin Lektionen mit Titel. Zuordnung aus dem Kurs selbst.
      const co = S.course || { levels: [], lessons: [] }, where = {};
      for (const l of co.lessons) for (const it of l.items || []) if (it.kind === 'exercise' && !where[it.url]) where[it.url] = l;
      const lessonOf = (e) => where[e.id] || co.lessons.find((l) => 'Kurs L' + l.num === e.category) || { num: Number(String(e.category).replace(/\D/g, '')) || 0, title: '', level: 0 };
      const groups = {}; for (const e of list) { const l = lessonOf(e); ((groups[l.level] = groups[l.level] || {})[l.num] = groups[l.level][l.num] || { l, items: [] }).items.push(e); }
      body = Object.keys(groups).map(Number).sort((x, y) => (x || 99) - (y || 99)).map((lv) => {
        const name = (co.levels.find((x) => x.level === lv) || {}).name; const les = Object.values(groups[lv]).sort((x, y) => x.l.num - y.l.num);
        const n = les.reduce((t, g) => t + g.items.length, 0), key = 'Kurs ' + lv;

  }).join('');
}

function weekKey(dateStr) { const d = new Date(dateStr + 'T12:00:00'); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return localDate(d); }
function weeksCircles(sessions, count = 8) {
  const byWeek = {};
  for (const s of sessions) { const k = weekKey(s.local_date); byWeek[k] = (byWeek[k] || 0) + s.seconds; }
  const out = []; const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  for (let i = count - 1; i >= 0; i--) { const x = new Date(d); x.setDate(d.getDate() - i * 7); const k = localDate(x); out.push({ k, min: mins(byWeek[k] || 0), label: x.toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric' }) }); }
  const max = Math.max(60, ...out.map((o) => o.min));
  return `<div class="weeks" aria-label="Übezeit der letzten ${count} Wochen">${out.map((o) => `<div class="w">${ring(o.min / max, 40, 5, 'var(--ring)', o.min + ' Minuten in der Woche ab ' + o.label, '')}<span>${o.min}′</span><span>${o.label}</span></div>`).join('')}</div>`;
}

const KEYS = [[/ghost/i, /ghost/i], [/paradiddle/i, /paradiddle/i], [/double/i, /double/i], [/single/i, /single/i], [/5 ?stroke/i, /5 stroke/i], [/6 ?stroke/i, /6 stroke/i],
  [/16tel|sechzehntel/i, /16tel/i], [/triole|12\/8/i, /triole/i], [/6\/8|3\/4/i, /6\/8|3\/4/i], [/fill/i, /^fill|fill \d/i], [/ride/i, /ride/i], [/offene? hi ?hat/i, /offener hi hat/i],
  [/bass|kick|fu(ß|ss)/i, /rl kk|bassdrum/i], [/metronom|timing|tempo/i, /singles 16tel mit bass|rlrl übers set/i], [/aufwärm|warm ?up/i, /^aufwärmen/i]];
function suggestions(f) {
  const out = [], seen = new Set();
  const openEx = new Set(f.assignments.filter((a) => a.status === 'offen' && a.exercise_id).map((a) => a.exercise_id));
  const draftEx = new Set((S.lesson ? S.lesson.new_assignments : []).map((a) => a.exercise_id).filter(Boolean));
  const ex = (S.exercises || []).filter((e) => !openEx.has(e.id) && !draftEx.has(e.id));
  const add = (e, why) => { if (e && !seen.has(e.id) && out.length < 5) { seen.add(e.id); out.push({ e, why }); } };
  const c = f.course;
  if (c && c.lessons.length) {
    const next = c.lessons.find((l) => l.level === (c.level || {}).level && !c.progress[l.id]);
    if (next) out.push({ lesson: next, why: `Nächste Lektion in Level ${next.level}` });
  }
  const notes = f.lessons.slice(0, 3).map((l) => [l.date, (l.notes_teacher || '') + ' ' + (l.notes_shared || '')]).concat([['Steckbrief', f.student.profile_note || '']]);
  for (const [from, text] of notes) for (const [k, pat] of KEYS) { const m = k.exec(text); if (m) add(ex.find((e) => pat.test(e.title)), `Notiz ${from === 'Steckbrief' ? 'im Steckbrief' : 'vom ' + fmtDate(from)}: "${m[0]}"`); }
  const st = S.data.students.find((x) => x.id === f.student.id);
  if (st && st.minutes_since < 20) add(ex.find((e) => /^Aufwärmen 1/.test(e.title)) || ex.find((e) => e.category === 'Aufwärmen'), `Nur ${st.minutes_since} min geübt seit der letzten Stunde: kurze tägliche Übung`);

}

      S.file = Object.assign(await api('/api/t/student', { id: S.file.student.id }), { course: S.file.course }); S.exercises = (await api('/api/t/exercises')).exercises; openOverlay(assignmentDetailView); toast('Gespeichert, gilt überall');
    } else if (fid === 'myGoalForm') {
      const title = $('#mg_title').value.trim(); if (!title) return;
      await api('/api/goal/add', { title }); S.data = await api('/api/home'); render(); toast('Ziel gespeichert');
    } else if (fid === 'partForm') {
      const title = $('#pt_title').value.trim(); if (!title) { toast('Titel fehlt'); return; }
      await api('/api/t/song/part/save', { song_id: S.song.song.id, title, url: $('#pt_url').value.trim() || null, notes: $('#pt_notes').value.trim() || null, notation: S.nt && S.nt.pt ? S.nt.pt : null, version: songCurVersion(S.song) });
      DrumNotation.stop(); if (S.nt) delete S.nt.pt; S.pt = null;
      S.song = await api('/api/song', { id: S.song.song.id }); S.songs = await api('/api/songs'); openOverlay(songView); toast('Baustein gespeichert');
    } else if (fid === 'linkEditForm') {
      const v = versionValue('le'); await api('/api/t/song/link/update', { id: S.linkEdit, title: $('#le_title').value.trim() || null, version: v });
      S.linkEdit = null; S.songVersion = v; S.song = await api('/api/song', { id: S.song.song.id }); rerenderSong(); toast('Gespeichert');
    } else if (fid === 'songBpmForm') {
      await api('/api/t/song/bpm', { song_id: S.song.song.id, bpm: Number($('#sb_bpm').value) || null, source: 'Oti' });
      S.song = await api('/api/song', { id: S.song.song.id }); S.songs = await api('/api/songs'); rerenderSong(); toast('Tempo gespeichert, gilt für alle Hausaufgaben mit diesem Song');
    } else if (fid === 'partEditForm') {
      await api('/api/t/song/part/update', { id: S.partEdit, title: $('#pe_title').value.trim(), url: $('#pe_url').value.trim() || null, notes: $('#pe_notes').value.trim() || null, notation: S.nt && S.nt.pe ? S.nt.pe : null, version: $('#pe_ver') ? $('#pe_ver').value : undefined });
      DrumNotation.stop(); S.partEdit = null; if (S.nt) delete S.nt.pe;
      S.song = await api('/api/song', { id: S.song.song.id }); rerenderSong(); toast('Gespeichert, gilt überall');
    } else if (fid === 'goalForm') {
      const t = $('#g_title').value.trim(); if (!t) return;
      S.lesson.new_goals.push({ title: t }); saveDraft(); render();
    } else if (fid === 'finishForm') saveSession(S.feeling);
  } catch (e) { S.loginError = fid === 'loginForm' ? e.message : S.loginError; if (fid === 'loginForm') render(); else toast(e.message); }
});

if ('serviceWorker' in navigator && !LOCAL) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
</html>
